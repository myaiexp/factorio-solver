[package]
name = "factorio-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "factorio-ui"
path = "src/main.rs"

[dependencies]
factorio-solver = { path = "../solver" }
factorio-templates = { path = "../templates" }
factorio-grid = { path = "../grid" }
factorio-blueprint = { path = "../blueprint" }
# "persistence" is not in eframe's defaults; it pulls in `ron` + `serde` for
# eframe's own use, but a crate deriving Serialize still has to declare serde
# itself — every other workspace crate already does.
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
# Already in the tree via egui-winit, but only for egui's own copy/paste and
# without "wayland-data-control". That feature is what lets the watcher read
# the clipboard while the *game* holds focus: plain Wayland hands the clipboard
# only to the focused surface, and wlr-data-control is the protocol that exists
# to lift that (it is how clipboard managers work). arboard prefers it whenever
# WAYLAND_DISPLAY is set and falls back to X11 otherwise, so this is additive.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3.27.0"
# The persist tests round-trip through JSON for readability; eframe's own
# storage is RON, but the leniency properties under test (missing fields,
# unknown fields) are format-independent.
serde_json = "1"
# For the save-picker's decode test: a synthetic save zip built from the real
# recipe registry, mirroring crates/solver's own dev-dependency on this.
factorio-save = { path = "../save", features = ["testsupport"] }
